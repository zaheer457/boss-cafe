<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Boss Cafe</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="top-strip text-center py-2 fw-semibold">
    Complete your order details
  </div>

  <main class="container py-4 py-md-5">
    <div class="row g-4">
      <div class="col-12 col-lg-7">
        <div class="checkout-card p-3 p-md-4">
          <h3 class="mb-3">Delivery Details</h3>
          <form id="checkoutForm" class="row g-3">
            <div class="col-12">
              <label for="fullName" class="form-label">Full Name</label>
              <input id="fullName" name="fullName" type="text" class="form-control" placeholder="Enter your name" required>
            </div>
            <div class="col-12 col-md-6">
              <label for="phone" class="form-label">Phone Number</label>
              <input id="phone" name="phone" type="tel" class="form-control" placeholder="03XXXXXXXXX" required>
            </div>
            <div class="col-12 col-md-6">
              <label for="email" class="form-label">Email (Optional)</label>
              <input id="email" name="email" type="email" class="form-control" placeholder="name@example.com">
            </div>
            <div class="col-12">
              <label for="address" class="form-label">Complete Address</label>
              <input id="address" name="address" type="text" class="form-control" placeholder="House #, street, block" required>
            </div>
            <div class="col-12 col-md-6">
              <label for="area" class="form-label">Area</label>
              <input id="area" name="area" type="text" class="form-control" placeholder="Korangi" required>
            </div>
            <div class="col-12 col-md-6">
              <label for="city" class="form-label">City</label>
              <input id="city" name="city" type="text" class="form-control" placeholder="Karachi" required>
            </div>
            <div class="col-12">
              <label for="landmark" class="form-label">Nearest Landmark</label>
              <input id="landmark" name="landmark" type="text" class="form-control" placeholder="Near park / masjid / school">
            </div>
            <div class="col-12">
              <label for="instructions" class="form-label">Order Instructions</label>
              <textarea id="instructions" name="instructions" class="form-control" rows="3" placeholder="Any special notes for rider or kitchen"></textarea>
            </div>
            <div class="col-12">
              <label class="form-label d-block">Payment Method</label>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="payment" id="cash" value="Cash on Delivery" checked>
                <label class="form-check-label" for="cash">Cash on Delivery</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="payment" id="card" value="Card on Delivery">
                <label class="form-check-label" for="card">Card on Delivery</label>
              </div>
            </div>
            <div class="col-12 d-flex gap-2 pt-1">
              <a href="index.html" class="btn btn-outline-secondary">Back to Menu</a>
              <button type="submit" class="btn btn-main">Confirm Order</button>
            </div>
          </form>
        </div>
      </div>

      <div class="col-12 col-lg-5">
        <div class="checkout-card p-3 p-md-4">
          <h4 class="mb-3">Order Summary</h4>
          <div id="checkoutItems" class="mb-3"></div>
          <div class="border-top pt-3">
            <div class="d-flex justify-content-between">
              <span>Items Total</span>
              <span id="checkoutSubTotal">Rs. 0</span>
            </div>
            <div class="d-flex justify-content-between mt-2">
              <span>Delivery Fee</span>
              <span id="checkoutDelivery">Rs. 250</span>
            </div>
            <div class="d-flex justify-content-between mt-2 fs-5 fw-bold">
              <span>Grand Total</span>
              <span id="checkoutGrandTotal">Rs. 0</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="checkout.js"></script>
</body>
</html>
